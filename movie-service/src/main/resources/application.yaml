server:
  port: 8081

spring:
  application:
    name: movie-service

recommendation:
  url: http://localhost:8082

manual:
  circuit-breaker:
    call-timeout: 1500ms
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10s
    permitted-number-of-calls-in-half-open-state: 2

management:
  endpoints:
    web:
      exposure:
        include: health

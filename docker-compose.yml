services:
  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: recommendation-service
    environment:
      CHAOS_MODE: ${CHAOS_MODE:-false}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  movie-service:
    build:
      context: ./movie-service
      dockerfile: Dockerfile
    container_name: movie-service
    environment:
      RECOMMENDATION_URL: http://recommendation-service:8082
    ports:
      - "8081:8081"
    depends_on:
      recommendation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    environment:
      MOVIE_SERVICE_URL: http://movie-service:8081
    ports:
      - "8090:8090"
    depends_on:
      movie-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/movies/123 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
